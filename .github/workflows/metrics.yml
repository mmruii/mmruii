name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # Se ejecuta todos los días a medianoche UTC
  workflow_dispatch:        # También se puede ejecutar manualmente

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate statistics and rank card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mmruii&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&icon_color=58a6ff&hide_border=true&include_all_commits=true&hide_rank=false
          path: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true

      - name: Commit statistics card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub statistics card"
            git push
          fi

      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mmruii
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics-languages.svg
          repositories_affiliations: owner, organization_member
          repositories_forks: yes
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, cmake,
            gnuplot, shell, batchfile
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          plugin_languages_other: yes

