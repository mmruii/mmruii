name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # Se ejecuta todos los días a medianoche UTC
  workflow_dispatch:        # También se puede ejecutar manualmente

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── SVG derecho: Lenguajes ───────────────────────────────────────
      - name: 🗣️ Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mmruii
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics-languages.svg
          repositories_affiliations: owner, organization_member
          repositories_exclude_forks: no
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, cmake,
            gnuplot, shell, batchfile
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          plugin_languages_other: yes

