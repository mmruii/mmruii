name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # Se ejecuta todos los días a medianoche UTC
  workflow_dispatch:        # También se puede ejecutar manualmente

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📊 Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mmruii

          # ─── Configuración base ───────────────────────────────────────
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Argentina/Buenos_Aires
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg

          # ─── Incluir repos de organizaciones ─────────────────────────
          repositories_affiliations: owner, organization_member
          # Esto hace que cuente repos donde sos miembro de la org
          # Especifica la org exacta para asegurarse de que los incluya
          repositories_exclude_forks: no
          # Permite incluir forks si los hay en la org

          # ─── Plugin: Lenguajes ────────────────────────────────────────
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, cmake,
            gnuplot, shell, batchfile
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes          # Analiza el código real, no solo los repos
          plugin_languages_indepth_custom: ""
          plugin_languages_other: yes

